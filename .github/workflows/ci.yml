on: [push, pull_request]

name: CI

jobs:
  CI:
    name: Node 20.19.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Prisma schema sync
        run: npm run check:schema

      - name: Run TypeScript type checking
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Validate Prisma
        run: npx prisma generate && npx prisma validate

      # The suite runs against prisma/dev.sqlite, which is gitignored, so the
      # migrations have to be applied before the tests can run.
      - name: Apply SQLite migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm run test

      - name: Build application
        run: npm run build
